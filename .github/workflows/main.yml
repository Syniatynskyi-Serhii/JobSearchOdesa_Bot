name: Run Bot

on:
  workflow_dispatch: # Дозволяє запуск вручну
  schedule:
    - cron: '0 8 * * *' # Запуск щодня о 08:00 UTC

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # сюди додаватимемо бібліотеки (наприклад: pip install requests)

      - name: Execute Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
